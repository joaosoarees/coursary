AWSTemplateFormatVersion: '2010-09-09'
Description: Access for coursary-api. A deployer role assumed from the owner's user, and a CI role assumed by GitHub Actions through OIDC.

Parameters:
  OwnerUserName:
    Type: String
    Default: joao-master
  DeploymentBucketName:
    Type: String
    Default: serverless-framework-deployments-sa-east-1-59910092-c003

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  CiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-api-ci
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:joaosoarees@59843125/coursary-api@1416276221:*

  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: coursary-api-boundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:TagResource
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/coursary-api-*
          - Effect: Allow
            Action: dynamodb:*
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coursary-api-*

  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-api-deployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:user/${OwnerUserName}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-1-1
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/coursary-api-*/*
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coursary-api-*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:aws:s3:::${DeploymentBucketName}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${DeploymentBucketName}/serverless/coursary-api/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/serverless-framework/*

        - PolicyName: deploy-1-2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:coursary-api-*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/coursary-api-*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref Boundary
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:DeleteRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
              - Effect: Deny
                Action: iam:*
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-deployer
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-ci

Outputs:
  CiRoleArn:
    Value: !GetAtt CiRole.Arn
  DeployerRoleArn:
    Value: !GetAtt DeployerRole.Arn
  BoundaryArn:
    Value: !Ref Boundary
