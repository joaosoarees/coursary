org: worldiary
service: coursary-api
frameworkVersion: '4.43.0'

provider: ${file(./sls/provider.yml)}

custom: ${file(./sls/custom.yml)}

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.js

functions:
  - ${file(./sls/functions/health.yml)}
  - ${file(./sls/functions/auth.yml)}
  - ${file(./sls/functions/account.yml)}
  - ${file(./sls/functions/admin.yml)}
  - ${file(./sls/functions/course.yml)}

resources:
  - ${file(./sls/resources/dynamodb/MainTable.yml)}
  - ${file(./sls/resources/cognito/UserPool.yml)}
  - ${file(./sls/resources/api-gateway/CustomDomain.yml)}
