# Permissions of every function, one block per function; each function keeps
# a role of its own (Q97) and points at its block from sls/functions/.

signUp:
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
    Resource: !GetAtt MainTable.Arn
  - Effect: Allow
    Action:
      - cognito-idp:AdminGetUser
      - cognito-idp:AdminDeleteUser
    Resource: !GetAtt UserPool.Arn

confirmSignUp:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:UpdateItem
    Resource: !GetAtt MainTable.Arn
  - Effect: Allow
    Action:
      - cognito-idp:AdminGetUser
    Resource: !GetAtt UserPool.Arn

resendConfirmationCode:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: !GetAtt MainTable.Arn

preTokenGeneration:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: !GetAtt MainTable.Arn

forgotPassword:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: !GetAtt MainTable.Arn

resetPassword:
  - Effect: Allow
    Action:
      - cognito-idp:AdminUserGlobalSignOut
    Resource: !GetAtt UserPool.Arn

getMe:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: !GetAtt MainTable.Arn

updateMe:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:UpdateItem
    Resource: !GetAtt MainTable.Arn
