statements:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:PutItem
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
    Resource: !GetAtt MainTable.Arn
  - Effect: Allow
    Action:
      - cognito-idp:AdminGetUser
      - cognito-idp:AdminDeleteUser
      - cognito-idp:AdminUserGlobalSignOut
    Resource: !GetAtt UserPool.Arn
