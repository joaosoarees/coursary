getMe:
  handler: src/main/functions/account/getMe.handler
  events:
    - httpApi:
        method: GET
        path: /me
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin

updateMe:
  handler: src/main/functions/account/updateMe.handler
  events:
    - httpApi:
        method: PATCH
        path: /me
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin
