promoteAdmin:
  handler: src/main/functions/admin/promoteAdmin.handler
  timeout: 5
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource: !GetAtt MainTable.Arn

listAccounts:
  handler: src/main/functions/admin/listAccounts.handler
  events:
    - httpApi:
        method: GET
        path: /admin/users
        authorizer: CognitoAuthorizer

findAccountByEmail:
  handler: src/main/functions/admin/findAccountByEmail.handler
  events:
    - httpApi:
        method: GET
        path: /admin/users/by-email
        authorizer: CognitoAuthorizer

changeRole:
  handler: src/main/functions/admin/changeRole.handler
  events:
    - httpApi:
        method: PUT
        path: /admin/users/{accountId}/role
        authorizer: CognitoAuthorizer

listRoleChanges:
  handler: src/main/functions/admin/listRoleChanges.handler
  events:
    - httpApi:
        method: GET
        path: /admin/users/{accountId}/role-changes
        authorizer: CognitoAuthorizer

disableAccount:
  handler: src/main/functions/admin/disableAccount.handler
  events:
    - httpApi:
        method: POST
        path: /admin/users/{accountId}/disable
        authorizer: CognitoAuthorizer

enableAccount:
  handler: src/main/functions/admin/enableAccount.handler
  events:
    - httpApi:
        method: POST
        path: /admin/users/{accountId}/enable
        authorizer: CognitoAuthorizer
