signUp:
  handler: src/main/functions/auth/signUp.handler
  events:
    - httpApi:
        method: POST
        path: /auth/sign-up

confirmSignUp:
  handler: src/main/functions/auth/confirmSignUp.handler
  events:
    - httpApi:
        method: POST
        path: /auth/confirm

resendConfirmationCode:
  handler: src/main/functions/auth/resendConfirmationCode.handler
  events:
    - httpApi:
        method: POST
        path: /auth/resend-code

preTokenGeneration:
  handler: src/main/functions/auth/preTokenGeneration.handler
  timeout: 5
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource: !GetAtt MainTable.Arn

signIn:
  handler: src/main/functions/auth/signIn.handler
  events:
    - httpApi:
        method: POST
        path: /auth/sign-in

refreshTokens:
  handler: src/main/functions/auth/refreshTokens.handler
  events:
    - httpApi:
        method: POST
        path: /auth/refresh

customMessage:
  handler: src/main/functions/auth/customMessage.handler
  timeout: 5
  iam:
    role:
      statements: []

forgotPassword:
  handler: src/main/functions/auth/forgotPassword.handler
  events:
    - httpApi:
        method: POST
        path: /auth/forgot-password

resetPassword:
  handler: src/main/functions/auth/resetPassword.handler
  events:
    - httpApi:
        method: POST
        path: /auth/reset-password
