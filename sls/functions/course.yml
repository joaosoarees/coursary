createCourse:
  handler: src/main/functions/course/createCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses
        authorizer: CognitoAuthorizer

listMyCourses:
  handler: src/main/functions/course/listMyCourses.handler
  events:
    - httpApi:
        method: GET
        path: /instructor/courses
        authorizer: CognitoAuthorizer

# Routes off for one deploy so they can come back with renamed parameters (Q277).
updateCourse:
  handler: src/main/functions/course/updateCourse.handler

publishCourse:
  handler: src/main/functions/course/publishCourse.handler

archiveCourse:
  handler: src/main/functions/course/archiveCourse.handler
