createCourse:
  handler: src/main/functions/course/createCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin

updateCourse:
  handler: src/main/functions/course/updateCourse.handler
  events:
    - httpApi:
        method: PATCH
        path: /courses/{courseId}
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin

listMyCourses:
  handler: src/main/functions/course/listMyCourses.handler
  events:
    - httpApi:
        method: GET
        path: /instructor/courses
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin

publishCourse:
  handler: src/main/functions/course/publishCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/publish
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin

archiveCourse:
  handler: src/main/functions/course/archiveCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/archive
        authorizer:
          name: CognitoAuthorizer
          scopes:
            - aws.cognito.signin.user.admin
