Resources:
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:service}-${sls:stage}-MainTable
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      DeletionProtectionEnabled: ${self:custom.stages.${sls:stage}.protected, false}
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: ${self:custom.stages.${sls:stage}.protected, false}
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
