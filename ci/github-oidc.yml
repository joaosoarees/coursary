AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions access for coursary-api CI. The role has no permissions; it only proves the account to the Serverless CLI.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  CiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-api-ci
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:joaosoarees/coursary-api:*

Outputs:
  CiRoleArn:
    Value: !GetAtt CiRole.Arn
